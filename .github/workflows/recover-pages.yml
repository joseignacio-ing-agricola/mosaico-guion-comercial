name: Recover blocked Pages deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages/deployments/ea2400fb98f52c6e13beed1341b52e938d7c011f/cancel")
          echo "Pages cancellation HTTP status: $status"
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            cat response.json
            exit 1
          fi
